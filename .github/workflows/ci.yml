name: Flowboard UI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm build
      - name: test
        run: pnpm test
      - name: Install Cypress binary
        run: pnpm exec cypress install
      - name: cypress
        run: pnpm cy:ci
      - name: docker setup
        uses: docker/setup-buildx-action@v3
      - name: docker build
        run: docker build -t flowboard:ci .
